name: Release
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shipyard-release
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.select.outputs.release }}
      tag: ${{ steps.select.outputs.tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      tooling_sha: ${{ steps.select.outputs.tooling_sha }}
      validate: ${{ steps.select.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: select
        env:
          DISPATCH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tooling_sha=$(git rev-parse HEAD)
          if test "$EVENT_NAME" = workflow_dispatch; then
            test "$DISPATCH_REF" = refs/heads/main
            mode=manual
            tag="$INPUT_TAG"
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            git show-ref --verify --quiet "refs/tags/$tag"
            source_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            validate=true
          else
            mode=automatic
            source_sha="$WORKFLOW_RUN_SHA"
            tooling_sha="$source_sha"
            validate=false
          fi

          git cat-file -e "$source_sha^{commit}"
          if test "$mode" = automatic; then
            git merge-base --is-ancestor "$source_sha" HEAD
          fi
          git worktree add --detach /tmp/shipyard-release-source "$source_sha"
          subject=$(git show -s --format=%s "$source_sha")
          selection=$(node scripts/release-selection.mjs \
            --mode "$mode" --source /tmp/shipyard-release-source \
            --subject "$subject" --tag "${tag:-}")
          release=$(printf '%s' "$selection" | jq -r .release)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if test "$release" != true; then
            echo "Commit is not a release commit; nothing to publish."
            exit 0
          fi

          tag=$(printf '%s' "$selection" | jq -r .tag)
          tag_commit=
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
          elif test "$mode" = manual; then
            echo "Manual recovery requires an existing $tag tag." >&2
            exit 1
          fi

          if release_json=$(gh api "repos/$GH_REPO/releases/tags/$tag" 2>/tmp/shipyard-release-error); then
            :
          else
            release_json=
            grep -q 'HTTP 404' /tmp/shipyard-release-error || {
              cat /tmp/shipyard-release-error >&2
              exit 1
            }
          fi
          node scripts/release-selection.mjs --mode state \
            --expected-commit "$source_sha" --expected-tag "$tag" \
            --tag-commit "$tag_commit" --release "$release_json" >/dev/null

          {
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "tooling_sha=$tooling_sha"
            echo "validate=$validate"
          } >> "$GITHUB_OUTPUT"
  validate:
    if: needs.select.outputs.validate == 'true'
    needs: select
    uses: ./.github/workflows/check.yaml
    with:
      ref: ${{ needs.select.outputs.source_sha }}
  publish:
    if: >-
      always() && needs.select.result == 'success' &&
      needs.select.outputs.release == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    needs: [select, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.tooling_sha }}
          path: tooling
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        working-directory: source
        env:
          TAG: ${{ needs.select.outputs.tag }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          {
            echo "version=$(cat VERSION)"
            echo "commit=$SOURCE_SHA"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: core
        with:
          context: source
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/amirhmzz/shipyard:${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
      - uses: docker/build-push-action@v6
        id: executor
        with:
          context: source
          target: host-executor
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/amirhmzz/shipyard-executor:${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
      - name: Require public image access
        env:
          CORE: ${{ steps.core.outputs.digest }}
          EXECUTOR: ${{ steps.executor.outputs.digest }}
        run: |
          mkdir -p /tmp/shipyard-anonymous-docker
          DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull "ghcr.io/amirhmzz/shipyard@$CORE"
          DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull "ghcr.io/amirhmzz/shipyard-executor@$EXECUTOR"
          for image in "ghcr.io/amirhmzz/shipyard@$CORE" "ghcr.io/amirhmzz/shipyard-executor@$EXECUTOR"; do
            docker buildx imagetools inspect "$image" --raw > /tmp/shipyard-image-index.json
            for arch in amd64 arm64; do jq -e --arg arch "$arch" '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' /tmp/shipyard-image-index.json; done
            for arch in amd64 arm64; do
              # Classic Docker stores one platform per index reference. Resolve each
              # platform manifest so verifying ARM64 cannot overwrite AMD64's digest.
              digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' /tmp/shipyard-image-index.json)
              platform_image="${image%@*}@$digest"
              DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull --platform "linux/$arch" "$platform_image"
              docker run --rm --platform "linux/$arch" "$platform_image" version | jq -e --arg version '${{ steps.metadata.outputs.version }}' --arg commit '${{ steps.metadata.outputs.commit }}' --arg arch "$arch" '.version == $version and .commit == $commit and .architecture == $arch'
            done
          done
      - name: Generate immutable installation artifacts
        working-directory: source
        env:
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          EXECUTOR_DIGEST: ${{ steps.executor.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          docker pull postgres:18-alpine
          POSTGRES_IMAGE=$(docker inspect postgres:18-alpine --format '{{index .RepoDigests 0}}')
          PREVIOUS_VERSION=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          export POSTGRES_IMAGE PREVIOUS_VERSION
          node ../tooling/scripts/release-manifest.mjs
          cd .local/release && sha256sum -c SHA256SUMS
      - name: Test the preceding published schema in both directions
        working-directory: source
        run: sh ../tooling/scripts/test-release-path.sh .local/release/release.json
      - name: Prepare notes from the versioned changelog
        working-directory: source
        env:
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          node ../tooling/scripts/release-notes.mjs --source . --tag "$TAG" \
            > /tmp/shipyard-release-notes.md
      - name: Create tag and publish completed release
        working-directory: source
        env:
          TAG: ${{ needs.select.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.select.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          remote_tag_commit() {
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
              git rev-parse "refs/tags/$TAG^{commit}"
            fi
          }

          tag_commit=$(remote_tag_commit)
          if test -n "$tag_commit"; then
            test "$tag_commit" = "$SOURCE_COMMIT"
          else
            if gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SOURCE_COMMIT" >/dev/null; then
              tag_commit="$SOURCE_COMMIT"
            else
              tag_commit=$(remote_tag_commit)
              test "$tag_commit" = "$SOURCE_COMMIT"
            fi
          fi

          state=missing
          if release_json=$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>/tmp/shipyard-release-error); then
            state=draft
          else
            release_json=
            grep -q 'HTTP 404' /tmp/shipyard-release-error || {
              cat /tmp/shipyard-release-error >&2
              exit 1
            }
          fi
          node ../tooling/scripts/release-selection.mjs --mode state \
            --expected-commit "$SOURCE_COMMIT" --expected-tag "$TAG" \
            --tag-commit "$tag_commit" --release "$release_json" >/dev/null

          title="$TAG"

          if test "$state" = draft; then
            gh release edit "$TAG" --title "$title" \
              --notes-file /tmp/shipyard-release-notes.md
            gh release upload "$TAG" .local/release/* --clobber
            test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" .local/release/* --verify-tag --latest \
              --title "$title" --notes-file /tmp/shipyard-release-notes.md
          fi
