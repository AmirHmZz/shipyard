name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag with a matching draft release (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shipyard-release
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      tooling_sha: ${{ steps.select.outputs.tooling_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: select
        env:
          TAG: ${{ inputs.tag }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$DISPATCH_REF" = 'refs/heads/main'
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git show-ref --verify --quiet "refs/tags/$TAG"
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$tag_commit" HEAD
          release=$(gh release view "$TAG" --json tagName,isDraft,isPrerelease)
          test "$(printf '%s' "$release" | jq -r .tagName)" = "$TAG"
          test "$(printf '%s' "$release" | jq -r .isDraft)" = true
          test "$(printf '%s' "$release" | jq -r .isPrerelease)" = false
          git worktree add --detach /tmp/shipyard-release-source "$TAG"
          version=$(cat /tmp/shipyard-release-source/VERSION)
          test "$TAG" = "v$version"
          test "$(jq -r .version /tmp/shipyard-release-source/web/package.json)" = "$version"
          grep -Fq "## [$version]" /tmp/shipyard-release-source/CHANGELOG.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: select
    uses: ./.github/workflows/check.yaml
    with:
      ref: ${{ needs.select.outputs.tag }}
  publish:
    needs: [select, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.tag }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.tooling_sha }}
          path: tooling
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        working-directory: source
        env:
          TAG: ${{ needs.select.outputs.tag }}
        run: |
          test "$TAG" = "v$(cat VERSION)"
          {
            echo "version=$(cat VERSION)"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: core
        with:
          context: source
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/amirhmzz/shipyard:${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
      - uses: docker/build-push-action@v6
        id: executor
        with:
          context: source
          target: host-executor
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/amirhmzz/shipyard-executor:${{ steps.metadata.outputs.version }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
      - name: Require public image access
        env:
          CORE: ${{ steps.core.outputs.digest }}
          EXECUTOR: ${{ steps.executor.outputs.digest }}
        run: |
          mkdir -p /tmp/shipyard-anonymous-docker
          DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull "ghcr.io/amirhmzz/shipyard@$CORE"
          DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull "ghcr.io/amirhmzz/shipyard-executor@$EXECUTOR"
          for image in "ghcr.io/amirhmzz/shipyard@$CORE" "ghcr.io/amirhmzz/shipyard-executor@$EXECUTOR"; do
            docker buildx imagetools inspect "$image" --raw > /tmp/shipyard-image-index.json
            for arch in amd64 arm64; do jq -e --arg arch "$arch" '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' /tmp/shipyard-image-index.json; done
            for arch in amd64 arm64; do
              # Classic Docker stores one platform per index reference. Resolve each
              # platform manifest so verifying ARM64 cannot overwrite AMD64's digest.
              digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' /tmp/shipyard-image-index.json)
              platform_image="${image%@*}@$digest"
              DOCKER_CONFIG=/tmp/shipyard-anonymous-docker docker pull --platform "linux/$arch" "$platform_image"
              docker run --rm --platform "linux/$arch" "$platform_image" version | jq -e --arg version '${{ steps.metadata.outputs.version }}' --arg commit '${{ steps.metadata.outputs.commit }}' --arg arch "$arch" '.version == $version and .commit == $commit and .architecture == $arch'
            done
          done
      - name: Generate immutable installation artifacts
        working-directory: source
        env:
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          EXECUTOR_DIGEST: ${{ steps.executor.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.commit }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          docker pull postgres:18-alpine
          POSTGRES_IMAGE=$(docker inspect postgres:18-alpine --format '{{index .RepoDigests 0}}')
          PREVIOUS_VERSION=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""' | sed 's/^v//')
          export POSTGRES_IMAGE PREVIOUS_VERSION
          node ../tooling/scripts/release-manifest.mjs
          cd .local/release && sha256sum -c SHA256SUMS
      - name: Test the preceding published schema in both directions
        working-directory: source
        run: sh ../tooling/scripts/test-release-path.sh .local/release/release.json
      - name: Publish completed release
        working-directory: source
        env:
          TAG: ${{ needs.select.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = true
          gh release upload "$TAG" .local/release/* --clobber
          gh release edit "$TAG" --draft=false --latest
